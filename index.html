<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Fitbay.id - Finance & Stock Tracker untuk Preloved & Live Shopping" />
    <meta name="theme-color" content="#0F0F0F" />
    
    <!-- iOS / Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitbay.id" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <title>Fitbay.id — Finance & Stock Tracker</title>
    <script>
      // Otomatis bersihkan tanda pagar (#) jika membuka link lama
      (function() {
        if (window.location.hash && window.location.hash.startsWith('#/')) {
          var cleanPath = window.location.hash.substring(1);
          window.history.replaceState(null, '', cleanPath);
        }
      })();
    </script>
  </head>
  <body class="dark:bg-[#0F0F0F] bg-gray-50 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
